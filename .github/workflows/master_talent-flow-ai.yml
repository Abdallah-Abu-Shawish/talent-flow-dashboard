# Docs for the Azure Web Apps Deploy action:
# https://github.com/Azure/webapps-deploy

name: Build and deploy PHP app to Azure Web App - talent-flow-ai

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # =====================================================
      # Checkout source code
      # =====================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =====================================================
      # PHP / Laravel
      # =====================================================
      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_pgsql, pgsql, openssl, tokenizer, xml, ctype, json, bcmath, fileinfo
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      # =====================================================
      # Node / Vite
      # =====================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      # =====================================================
      # Verify required Laravel deployment files
      # =====================================================
      - name: Verify deployment build
        run: |
          test -f artisan
          test -d vendor
          test -f public/index.php
          test -f public/build/manifest.json
          test -f startup.sh
          test -f default
          echo "Laravel deployment verification passed."
          echo "Vite manifest:"
          ls -la public/build
          echo "Vendor directory exists:"
          ls -ld vendor

      # =====================================================
      # Upload application artifact
      # =====================================================
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: php-app
          path: |
            .
            !node_modules
            !.git
            !.env
            !.env.*
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      # =====================================================
      # Download built application
      # =====================================================
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: php-app
          path: .

      # =====================================================
      # Azure authentication
      # =====================================================
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E0EFB7BE2FB74735B668CE2F02A9D41D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_4E29409CA5784A05890A79FD48D4EDF9 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_581D1A52FDFC44A39BBCFAF12D51361A }}

      # =====================================================
      # Deploy Laravel to Azure App Service
      # =====================================================
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'talent-flow-ai'
          slot-name: 'Production'
          package: .
